["1","Name and territory of the Union","Part I","India, that is Bharat, shall be a Union of States.","ONE India: name + territory.","Article 1 = identity card of the Union.","Union of States; not an agreement among sovereign States."],

["18","Abolition of titles","Part III","Abolishes titles, subject to the constitutional treatment of military and academic distinctions.","18 = no titles.","Supports republican equality."],

onal and Special Provisions","369–392","Special provisions for States and transition"],["XXII","Short Title, Commencement, Authoritative Text in Hindi and Repeals","393–395","Final provisions"]];

function modal(html){$("#modalbox").innerHTML='<button class="close" onclick="closeModal()">✕</button>'+html;$("#modal").classList.remove("hidden")}function closeModal(){$("#modal").classList.add("hidden")}$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
function render(page){let f={home,roadmap,parts,mindmaps,articles,schedules,amendments,cases,tricks,flash,quiz,admin,revision,sources};$("#view").innerHTML=f[page]();if(page==="parts")$("#partsearch").oninput=e=>$("#partgrid").innerHTML=PARTS.map((p,i)=>({p,i})).filter(x=>x.p.join(" ").toLowerCase().includes(e.target.value.toLowerCase())).map(x=>partCard(x.p,x.i)).join("");if(page==="articles")$("#asearch").oninput=e=>{let f=document.querySelector("#filters .selected").textContent;$("#alist").innerHTML=articleRows(A.filter(a=>(f==="All"||a[2]===f)&&a.join(" ").toLowerCase().includes(e.target.value.toLowerCase())))};if(page==="mindmaps")drawMap("rights",document.querySelector("#view .pill"));if(page==="quiz"){qIndex=0;qScore=0;drawQ()}}
render("home");
</script></body></html>
