<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive Indian Constitution learning for UGC NET/JRF and Public Administration"><title>Constitution 360°</title><style>
:root{--n:#142840;--b:#24576a;--g:#e8a340;--bg:#f5f3ed;--ink:#17283e;--muted:#68778a;--line:#e5e8ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Segoe UI,sans-serif}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--n);color:white;padding:20px;position:sticky;top:0;height:100vh}.brand{font-weight:850;letter-spacing:.06em;margin:5px 8px 24px}.brand small{display:block;color:#adc2d6;font-weight:400;letter-spacing:0}.nav button{display:block;width:100%;border:0;background:none;color:#d2deea;text-align:left;padding:11px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#294661;color:white}.main{min-width:0}.top{background:white;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0}.wrap{max-width:1150px;margin:auto;padding:28px}.hero{background:linear-gradient(115deg,var(--n),var(--b));color:white;padding:34px;border-radius:20px}.hero h1{font-size:clamp(29px,4vw,44px);line-height:1.1;margin:10px 0}.hero p{color:#d5e1e9;max-width:680px}.eyebrow{color:#bd7b20;text-transform:uppercase;font-size:11px;letter-spacing:.15em;font-weight:800}.hero .eyebrow{color:#f5c474}.btn{border:0;border-radius:9px;background:var(--g);color:#18283d;font-weight:750;padding:10px 15px;cursor:pointer}.alt{background:#edf1f5}.grid,.stats{display:grid;gap:13px}.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr);margin:18px 0}.card,.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.card{cursor:pointer}.card:hover{box-shadow:0 8px 24px #17283e12;transform:translateY(-2px)}.card h3{margin:6px 0}.card p,.muted,.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px}.tag{display:inline-block;background:#edf5f3;color:#14786e;border-radius:20px;padding:4px 8px;font-size:10px;margin-top:8px}.section{margin:26px 0 12px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:12px 0}.callout{background:#fff7e8;border-left:3px solid var(--g);padding:13px;border-radius:8px}.modal{position:fixed;inset:0;background:#091526aa;display:grid;place-items:center;padding:18px;z-index:4}.modal>div{background:white;padding:24px;border-radius:16px;max-width:650px;width:100%;max-height:88vh;overflow:auto}.hidden{display:none}.close{float:right;border:0;padding:7px 10px;border-radius:8px;cursor:pointer}.opts button{display:block;width:100%;text-align:left;padding:11px;margin:7px 0;background:white;border:1px solid var(--line);border-radius:8px;cursor:pointer}a{color:#176b80}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{height:auto;position:static;padding:12px}.brand{margin:4px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto;font-size:12px}.wrap{padding:16px}.top{padding:14px 18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:23px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">§ CONSTITUTION 360°<small>India's constitutional second brain</small></div><nav class="nav" id="nav"><button class="active" data-p="home">⌂ Dashboard</button><button data-p="map">◈ Constitution map</button><button data-p="articles">§ Article library</button><button data-p="cases">⚖ Case stories</button><button data-p="memory">✧ Memory lab</button><button data-p="admin">▤ Public Administration</button><button data-p="quiz">◎ Quiz arena</button></nav></aside><main class="main"><div class="top">Your learning space / <b id="crumb">Dashboard</b></div><div class="wrap" id="view"></div></main></div><div class="modal hidden" id="modal"><div id="modalcontent"></div></div>
<script>
const A=[[1,"Name and territory of the Union","Part I","India, that is Bharat, shall be a Union of States.","Article 1 = India's identity and territory.","Think of the country's name and map on an atlas."],[3,"Formation of new States","Part I","Parliament may form new States and alter areas, boundaries or names through the constitutional process.","Article 3 = redraw the map.","State reorganisation involves Parliament and consultation with the affected State Legislature."],[14,"Equality before law","Part III","The State shall not deny any person equality before the law or equal protection of the laws.","14 = equal treatment under law.","A public office should not arbitrarily treat similarly placed applicants differently."],[15,"Prohibition of discrimination","Part III","The State shall not discriminate against a citizen only on specified grounds, subject to constitutional provisions.","15 = no discrimination on listed grounds.","Access to public facilities cannot be denied merely on a prohibited ground."],[16,"Equality of opportunity in public employment","Part III","There shall be equality of opportunity for citizens in matters of public employment, subject to constitutional provisions.","16 = fair opportunity for public jobs.","Recruitment rules must comply with equality and constitutionally permitted reservation."],[19,"Protection of certain freedoms","Part III","Protects specified freedoms of citizens, subject to constitutionally permitted reasonable restrictions.","19 = remember the six freedoms.","A peaceful public demonstration engages freedom of assembly alongside lawful restrictions."],[21,"Life and personal liberty","Part III","No person shall be deprived of life or personal liberty except according to procedure established by law.","21 = Life + Liberty.","State action affecting liberty must follow constitutionally valid procedure; interpretation includes dignified life."],["21A","Right to education","Part III","The State shall provide free and compulsory education to children aged six to fourteen years.","21A = education ages 6–14.","Public schooling connects this right to education policy and service delivery."],[32,"Constitutional remedies","Part III","The right to move the Supreme Court for enforcement of Fundamental Rights is guaranteed.","32 = Supreme Court remedy for Fundamental Rights.","A person may approach the Supreme Court to enforce a Fundamental Right."],[40,"Organisation of village panchayats","Part IV","The State shall take steps to organise village panchayats as units of self-government.","40 = village self-government.","Village-level planning brings decision-making closer to residents."],[50,"Separation of judiciary from executive","Part IV","The State shall take steps to separate the judiciary from the executive in public services of the State.","50 = separate judicial and executive functions.","Institutional separation supports impartial adjudication."],["51A","Fundamental Duties","Part IVA","It is the duty of every citizen to respect the Constitution, its ideals and institutions, among other duties.","51A = citizen duties.","Respect for constitutional institutions is a civic responsibility."],[110,"Definition of Money Bills","Part V","Defines a Money Bill by reference to specified financial matters.","110 = Money Bill definition.","Classification affects the Rajya Sabha's role in the legislative process."],[123,"President's ordinance power","Part V","The President may promulgate an Ordinance when both Houses are not simultaneously in session and constitutional conditions are met.","123 = Union ordinance between sessions.","An Ordinance is a temporary legislative route, not a substitute for normal lawmaking."],[148,"Comptroller and Auditor-General","Part V","Provides for the Comptroller and Auditor-General of India.","148 = CAG; public audit.","Audit scrutiny supports legislative oversight of public expenditure."],[280,"Finance Commission","Part XII","The President shall constitute a Finance Commission at the prescribed interval.","280 = Finance Commission and fiscal federalism.","Recommendations help shape financial resource distribution between Union and States."],[315,"Public Service Commissions","Part XIV","Provides for a Public Service Commission for the Union and each State, subject to constitutional provisions.","315 = UPSC and State PSC framework.","Constitutional commissions support recruitment to public services."],[324,"Election Commission","Part XV","Superintendence, direction and control of specified elections are vested in the Election Commission.","324 = election supervision.","The Election Commission administers elections within its constitutional mandate."],[356,"President's Rule in States","Part XVIII","Provides for action where the constitutional machinery of a State has failed, subject to constitutional conditions.","356 = failure of constitutional machinery in a State.","Its use is subject to parliamentary control and judicial review principles."],[368,"Amendment of the Constitution","Part XX","Provides Parliament's power and procedure to amend the Constitution, with special requirements for specified matters.","368 = constitutional amendment procedure.","The basic structure doctrine limits the amending power."]];
const C=[["Kesavananda Bharati (1973)","Can Parliament amend any part of the Constitution without limit?","Parliament may amend the Constitution but cannot damage or destroy its basic structure.","Kesavananda = amendment power has a basic-structure boundary.","Article 368 · Constitutional limits on institutional power."],["Maneka Gandhi (1978)","Does procedure affecting personal liberty need to be fair, just and reasonable?","The Court linked Articles 14, 19 and 21 and rejected arbitrary procedure.","Maneka = fairness in procedure; Articles 14, 19, 21 work together.","Article 21 · Fair procedure and accountable administration."],["S.R. Bommai (1994)","Can President's Rule be imposed without meaningful constitutional scrutiny?","The judgment strengthened judicial review of Article 356 proclamations and federalism.","Bommai = Article 356 is reviewable; federalism matters.","Article 356 · Centre-State relations and constitutional accountability."],["Minerva Mills (1980)","Is Parliament's amending power unlimited?","Limited amending power and harmony between Fundamental Rights and Directive Principles are part of the basic structure.","Minerva = limited power + balance.","Article 368 · Constitutional checks on institutions."],["Indra Sawhney (1992)","How should reservation in public employment operate under Article 16?","The judgment examined reservation under Article 16(4), including the creamy-layer principle for OBCs and the general 50% ceiling subject to exceptional circumstances.","Indra Sawhney = reservation doctrine and creamy layer.","Article 16 · Equality, representation and personnel administration."]];
const P=[["Part I","The Union and its Territory","Arts. 1–4"],["Part II","Citizenship","Arts. 5–11"],["Part III","Fundamental Rights","Arts. 12–35"],["Part IV","Directive Principles of State Policy","Arts. 36–51"],["Part IVA","Fundamental Duties","Art. 51A"],["Part V","The Union","Arts. 52–151"],["Part VI","The States","Arts. 152–237"],["Part VIII","The Union Territories","Arts. 239–242"],["Part IX","The Panchayats","Arts. 243–243O"],["Part IXA","The Municipalities","Arts. 243P–243ZG"],["Part XI","Relations between the Union and the States","Arts. 245–263"],["Part XII","Finance, Property, Contracts and Suits","Arts. 264–300A"],["Part XIV","Services under the Union and the States","Arts. 308–323"],["Part XV","Elections","Arts. 324–329A"],["Part XVIII","Emergency Provisions","Arts. 352–360"],["Part XX","Amendment of the Constitution","Art. 368"]];
const sources=[["Legislative Department","Official Constitution and amendments","https://legislative.gov.in/constitution-of-india/"],["India Code","Central and state legislation database","https://www.indiacode.nic.in/"],["Supreme Court of India","Judgments and institutional information","https://www.sci.gov.in/"],["Constitution of India","Constituent Assembly resources","https://www.constitutionofindia.net/"],["PRS Legislative Research","Legislative briefs and analysis","https://prsindia.org/"],["Digital Sansad","Parliament information","https://sansad.in/"]];
const Q=[["Which Article guarantees equality before the law?",["Article 12","Article 14","Article 16","Article 21"],1,"Article 14 is the core equality guarantee."],["Which Article guarantees the right to move the Supreme Court for enforcement of Fundamental Rights?",["Article 21","Article 32","Article 40","Article 226"],1,"Article 32 is itself a Fundamental Right."],["Which Article provides for the Finance Commission?",["Article 148","Article 280","Article 315","Article 324"],1,"Article 280 concerns fiscal distribution recommendations."],["Which Article provides for Public Service Commissions?",["Article 280","Article 312","Article 315","Article 368"],2,"Article 315 establishes the Union and State PSC framework."],["Which case is associated with the basic structure doctrine?",["Golaknath","Kesavananda Bharati","A.K. Gopalan","Shankari Prasad"],1,"Kesavananda Bharati (1973) is the landmark basic structure case."]];
let S={learned:[],queue:{},best:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem("constitution360")||"{}"))}catch(e){}const $=s=>document.querySelector(s);function save(){localStorage.setItem("constitution360",JSON.stringify(S))}
function go(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));$("#crumb").textContent=({home:"Dashboard",map:"Constitution map",articles:"Article library",cases:"Case stories",memory:"Memory lab",admin:"Public Administration",quiz:"Quiz arena"})[p];render(p);scrollTo(0,0)}$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-p]");if(b)go(b.dataset.p)});
function home(){return '<section class="hero"><div class="eyebrow">Learn · connect · recall · apply</div><h1>Understand the Constitution. Remember it for life.</h1><p>A visual, interactive learning workspace for the Indian Constitution, UGC NET/JRF and Public Administration.</p><button class="btn" onclick="go(\'map\')">Explore Constitution →</button> <button class="btn alt" onclick="go(\'memory\')">Start revision</button></section><div class="stats"><div class="stat"><small>Concepts learned</small><strong>'+S.learned.length+'</strong></div><div class="stat"><small>Review cards</small><strong>'+Object.keys(S.queue).length+'</strong></div><div class="stat"><small>Best quiz score</small><strong>'+S.best+'%</strong></div><div class="stat"><small>Article cards</small><strong>'+A.length+'</strong></div></div><h2 class="section">Your learning routes</h2><div class="grid">'+[['🗺️','Constitution map','Explore the structure by Parts.','map'],['📚','Article library','Simple meaning, memory trick and real-life connection.','articles'],['⚖️','Case stories','Remember issue, ruling and administrative relevance.','cases'],['🧠','Memory lab','Retrieve concepts and schedule revisions.','memory'],['🏛️','Public Administration','Connect constitutional rules to governance.','admin'],['🎯','Quiz arena','Test recall with explanations.','quiz']].map(x=>'<div class="card" onclick="go(\''+x[3]+'\')"><div style="font-size:24px">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p><span class="tag">Open module →</span></div>').join('')+'</div><h2 class="section">Trusted source shelf</h2><div class="grid">'+sources.map(s=>'<a class="card" href="'+s[2]+'" target="_blank" rel="noopener"><h3>'+s[0]+' ↗</h3><p>'+s[1]+'</p></a>').join('')+'</div>'}
function mapPage(){return '<div class="eyebrow">Explore by constitutional structure</div><h1>Constitution map</h1><p class="muted">Choose a Part to see its scope and matching starter cards. Verify precise ranges and current text in the official Constitution.</p><div class="grid">'+P.map((p,i)=>'<div class="card" onclick="part('+i+')"><span class="tag">'+p[0]+' · '+p[2]+'</span><h3>'+p[1]+'</h3><p>Explore the constitutional theme and related learning cards.</p></div>').join('')+'</div>'}
function cards(list){return list.map(a=>'<div class="card" onclick="article(\''+a[0]+'\')"><span class="eyebrow">ARTICLE '+a[0]+'</span><h3>'+a[1]+'</h3><p>'+a[2]+'</p><span class="tag">Open memory card →</span></div>').join('')||'<p>No matching cards.</p>'}
function articlePage(){return '<div class="eyebrow">Plain language · memory hooks · real-life examples</div><h1>Article library</h1><p class="muted">Starter collection of high-value Articles. Explanations are paraphrases, not official wording.</p><input class="search" id="find" placeholder="Search Article number, topic or Part…"><div class="grid" id="articlegrid">'+cards(A)+'</div>'}
function article(n){let a=A.find(x=>String(x[0])===String(n));$("#modalcontent").innerHTML='<button class="close" onclick="closeM()">✕</button><span class="tag">'+a[2]+'</span><h2>Article '+a[0]+' · '+a[1]+'</h2><h3>In simple words</h3><p>'+a[3]+'</p><div class="callout"><b>Memory hook</b><br>'+a[4]+'</div><h3>Real-life connection</h3><p>'+a[5]+'</p><p class="muted">Educational paraphrase. Verify exact wording, amendments and current interpretation against primary sources.</p><button class="btn" onclick="learn(\''+a[0]+'\')">Mark learned</button> <button class="btn alt" onclick="queue(\''+a[0]+'\')">Add to review</button>';$("#modal").classList.remove("hidden")}
function learn(n){if(!S.learned.includes(String(n)))S.learned.push(String(n));save();article(n)}function queue(n){let a=A.find(x=>String(x[0])===String(n));S.queue[n]={front:"Recall Article "+n+": "+a[1],back:a[4],due:Date.now()};save();alert("Added to Memory Lab.")}
function part(i){let p=P[i],rel=A.filter(a=>a[2]===p[0]);$("#modalcontent").innerHTML='<button class="close" onclick="closeM()">✕</button><span class="tag">'+p[0]+' · '+p[2]+'</span><h2>'+p[1]+'</h2><p>Study the official text, identify its constitutional purpose, connect it to an Indian governance example and test recall.</p><h3>Related starter cards</h3>'+rel.map(a=>'<p><a href="#" onclick="article(\''+a[0]+'\');return false">Article '+a[0]+' — '+a[1]+'</a></p>').join('')+'<a href="https://legislative.gov.in/constitution-of-india/" target="_blank">Official Constitution ↗</a>';$("#modal").classList.remove("hidden")}
function closeM(){$("#modal").classList.add("hidden")}$("#modal").onclick=e=>{if(e.target.id==="modal")closeM()};
function casesPage(){return '<div class="eyebrow">Landmark judgments as stories</div><h1>Case story room</h1><div class="grid">'+C.map((c,i)=>'<div class="card" onclick="caseOpen('+i+')"><span class="eyebrow">CASE 0'+(i+1)+'</span><h3>'+c[0]+'</h3><p>'+c[1]+'</p><span class="tag">'+c[4].split('·')[0]+'</span></div>').join('')+'</div>'}
function caseOpen(i){let c=C[i];$("#modalcontent").innerHTML='<button class="close" onclick="closeM()">✕</button><h2>'+c[0]+'</h2><h3>Constitutional question</h3><p>'+c[1]+'</p><h3>Core holding</h3><p>'+c[2]+'</p><div class="callout"><b>Memory hook</b><br>'+c[3]+'</div><h3>Administration connection</h3><p>'+c[4]+'</p><p class="muted">Verify detailed propositions from the full judgment.</p><a href="https://www.sci.gov.in/" target="_blank">Supreme Court of India ↗</a>';$("#modal").classList.remove("hidden")}
function adminPage(){let d=[["Article 14","Administrative fairness","Public authorities must avoid arbitrary treatment."],["Article 16","Public personnel administration","Equality of opportunity in public employment, subject to constitutional provisions."],["Article 21","Citizen-centric governance","Dignity, liberty and fair procedure shape public service delivery."],["Article 148","Financial accountability","CAG audit supports legislative scrutiny of public expenditure."],["Article 280","Fiscal federalism","Finance Commission recommendations shape Union-State resource sharing."],["Article 315","Merit-based recruitment","UPSC and State PSCs are constitutional recruitment institutions."],["Article 324","Election management","Constitutional authority for superintendence, direction and control of elections."]];return '<div class="eyebrow">Your Paper II bridge</div><h1>Constitution × Public Administration</h1><p class="muted">Connect provisions with recruitment, accountability, decentralisation, public finance and citizen rights.</p><div class="grid">'+d.map(x=>'<div class="card"><span class="eyebrow">'+x[0]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div><div class="panel"><h3>Five-step answer framework</h3><ol><li>Identify the constitutional provision.</li><li>Explain the administrative principle.</li><li>Connect a relevant thinker or theory.</li><li>Use an Indian governance example.</li><li>Write a 100-word answer from memory.</li></ol></div>'}
function memoryPage(){let due=Object.entries(S.queue).filter(x=>x[1].due<=Date.now());return '<div class="eyebrow">Retrieval practice · spaced review</div><h1>Memory lab</h1><p class="muted">Try to recall before revealing. Rate your recall to schedule the next review.</p><div class="panel">'+(due.length?'<span class="tag">Due now · '+due[0][0]+'</span><h2>'+due[0][1].front+'</h2><button class="btn" id="reveal">Reveal memory hook</button><div id="back" class="hidden"><div class="callout">'+due[0][1].back+'</div><p>How well did you remember?</p><button class="btn" onclick="rate(\''+due[0][0]+'\',0)">Again</button> <button class="btn alt" onclick="rate(\''+due[0][0]+'\',1)">Hard</button> <button class="btn alt" onclick="rate(\''+due[0][0]+'\',2)">Good</button> <button class="btn alt" onclick="rate(\''+due[0][0]+'\',3)">Easy</button></div>':'<h2>All caught up ✨</h2><p>No cards due. Add some from the Article library.</p>')+'</div><div class="section"><button class="btn" onclick="seed()">Add Articles 14, 16, 21, 32, 280, 315, 324</button></div>'}
function seed(){[14,16,21,32,280,315,324].forEach(n=>{let a=A.find(x=>String(x[0])===String(n));if(a&&!S.queue[n])S.queue[n]={front:"Recall Article "+n+": "+a[1],back:a[4],due:Date.now()}});save();go("memory")}function rate(n,r){S.queue[n].due=Date.now()+(r===0?600000:[86400000,259200000,604800000][r-1]);save();go("memory")}
let qi=0,score=0;function quizPage(){return '<div class="eyebrow">Practice · feedback · retrieval</div><h1>NET/JRF quiz arena</h1><p class="muted">Attempt before reading the explanation.</p><div class="panel" id="quiz"></div>'}function drawQ(){let q=Q[qi];if(!q){let pct=Math.round(score/Q.length*100);S.best=Math.max(S.best,pct);save();$("#quiz").innerHTML='<h2>Practice complete</h2><h1>'+score+'/'+Q.length+'</h1><p>Score: '+pct+'%</p><button class="btn" onclick="qi=0;score=0;drawQ()">Try again</button>';return}$("#quiz").innerHTML='<p class="muted">Question '+(qi+1)+' of '+Q.length+'</p><h3>'+q[0]+'</h3><div class="opts">'+q[1].map((o,i)=>'<button onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div id="feedback"></div>'}function answer(i){let q=Q[qi],ok=i===q[2];if(ok)score++;$("#feedback").innerHTML='<div class="callout"><b>'+(ok?'Correct!':'Correct answer: '+q[1][q[2]])+'</b><br>'+q[3]+'<p><button class="btn" onclick="qi++;drawQ()">Next →</button></p></div>'}
function render(p){$("#view").innerHTML=({home:home,map:mapPage,articles:articlePage,cases:casesPage,memory:memoryPage,admin:adminPage,quiz:quizPage})[p]();if(p==="articles")$("#find").oninput=e=>$("#articlegrid").innerHTML=cards(A.filter(a=>a.join(" ").toLowerCase().includes(e.target.value.toLowerCase())));if(p==="memory"&&$("#reveal"))$("#reveal").onclick=()=>$("#back").classList.remove("hidden");if(p==="quiz"){qi=0;score=0;drawQ()}}render("home");
</script></body></html>
